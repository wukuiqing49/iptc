schemaVersion: '1.0'
locale: it-IT
pages:
  /it-IT/:
    title: CaptionMeta - Strumento per metadati fotografici Android
    description: CaptionMeta
    primaryQuery: photo metadata editor
  /it-IT/features/modifica-iptc-exif-e-xmp/:
    title: Modifica IPTC, EXIF e XMP - CaptionMeta
    description: Controlla e modifica didascalie, titoli, parole chiave, autori, copyright,
      diritti e posizione.
    primaryQuery: IPTC metadata editor for Android
  /it-IT/features/pulizia-dei-metadati-privati/:
    title: Pulizia dei metadati privati - CaptionMeta
    description: Controlla e pulisci dati EXIF, IPTC e XMP selezionati prima di condividere
      una copia elaborata.
    primaryQuery: remove EXIF metadata Android
  /it-IT/features/preset-in-batch/:
    title: Preset in batch - CaptionMeta
    description: Riutilizza preset IPTC su più foto mantenendo le modifiche per singola
      foto.
    primaryQuery: batch IPTC metadata editor
  /it-IT/features/coda-di-consegna-foto/:
    title: Coda di consegna foto - CaptionMeta
    description: Metti in coda le foto elaborate, consegnale tramite server configurati
      e controlla i risultati.
    primaryQuery: photo upload queue Android
