schemaVersion: '1.0'
locale: ja-JP
pages:
  /ja-JP/:
    title: CaptionMeta - Android 写真メタデータツール
    description: AndroidでIPTC、EXIF、XMP写真メタデータを編集し、非公開データを整理して写真を納品できます。
    primaryQuery: photo metadata editor
  /ja-JP/features/iptc-exif-xmpの編集/:
    title: IPTC、EXIF、XMPの編集 - CaptionMeta
    description: キャプション、見出し、キーワード、署名、著作権、権利、位置情報を確認・編集します。
    primaryQuery: IPTC metadata editor for Android
  /ja-JP/features/非公開メタデータの整理/:
    title: 非公開メタデータの整理 - CaptionMeta
    description: 写真コピーを共有する前に、選択したEXIF、IPTC、XMPデータを確認して削除します。
    primaryQuery: remove EXIF metadata Android
  /ja-JP/features/一括プリセット/:
    title: 一括プリセット - CaptionMeta
    description: IPTCプリセットを複数の写真で再利用し、写真ごとの上書きも保持します。
    primaryQuery: batch IPTC metadata editor
  /ja-JP/features/写真納品キュー/:
    title: 写真納品キュー - CaptionMeta
    description: 処理した写真をキューに入れ、設定済みサーバーへ納品して結果を確認します。
    primaryQuery: photo upload queue Android
