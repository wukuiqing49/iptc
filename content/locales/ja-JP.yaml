  content:
    - heading: "データの取り扱い"
      paragraphs: ["CaptionMetaはAndroidワークフローで写真とメタデータを処理します。ユーザーが納品を設定して開始した場合に限り、処理済みファイルが指定サーバーへ送信されることがあります。", "撮影、GPSメタデータ、写真選択のために、カメラ、位置情報、メディアへのアクセスを求めることがあります。"]
    - heading: "統合サービス"
      paragraphs: ["アカウント、購入、アプリ運用のためにGoogleログイン、Google Play Billing、Firebaseを統合しています。公開前に完全なプライバシーポリシーとストアのデータ安全性申告を確認してください。"]

