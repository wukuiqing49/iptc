home:
  pageTitle: "CaptionMeta - Android 写真メタデータツール"
  metaDescription: "AndroidでIPTC、EXIF、XMP写真メタデータを編集し、非公開データを整理して写真を納品できます。"
  category: "Android写真ツール"
  tagline: "現場で使える写真メタデータ。"
