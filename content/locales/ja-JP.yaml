  fullDescription: "CaptionMetaはAndroid向けの写真メタデータツールです。IPTC、EXIF、XMPの項目を確認・編集し、プリセットを再利用して、非公開メタデータを整理した写真コピーを納品できます。"
  heroScreenshotAlt: "CaptionMetaの実際のアプリ画面"
  heroScreenshotCaption: "接続端末に表示されたCaptionMetaの画面"
  featuresHeading: "撮影から納品までのメタデータワークフロー"
  featuresIntro: "現在のAndroidソースコード、テスト、インストール済みアプリ画面で確認できる機能です。"
  features:
    metadata-editor: {name: "IPTC、EXIF、XMPの編集", description: "キャプション、見出し、キーワード、署名、著作権、権利、位置情報を確認・編集します。"}
    privacy-cleanup: {name: "非公開メタデータの整理", description: "写真コピーを共有する前に、選択したEXIF、IPTC、XMPデータを確認して削除します。"}
    batch-presets: {name: "一括プリセット", description: "IPTCプリセットを複数の写真で再利用し、写真ごとの上書きも保持します。"}
    photo-delivery: {name: "写真納品キュー", description: "処理した写真をキューに入れ、設定済みサーバーへ納品して結果を確認します。"}
  screenshotsHeading: "アプリを見る"
