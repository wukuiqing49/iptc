featureDetails:
  metadata-editor:
    problem: "Передача фотографий становится непоследовательной, если подписи, авторство, права и ключевые слова редактируются по-разному для каждого изображения."
    capabilities: ["Читать и проверять поддерживаемые метаданные EXIF, IPTC и XMP", "Записывать подписи, заголовки, ключевые слова, авторство, права и местоположение в обработанные копии", "Уточнять или заменять пакетные значения значениями для отдельной фотографии"]
    supportedInputs: ["Локальные файлы фотографий, выбранные на устройстве Android"]
    supportedOutputs: ["Обработанные копии фотографий с выбранными полями метаданных"]
    options: ["Основные и расширенные поля IPTC, поля XMP, обработка EXIF и местоположение"]
    steps: ["Выберите одну фотографию или группу локальных фотографий", "Выберите шаблон или введите подписи, заголовки, ключевые слова, автора и права", "Проверьте результат и сохраните обработанную копию"]
    limitations: ["Доступные поля и поведение записи зависят от выбранного файла и включённых в процессе полей."]
    faq: [{question: "Можно ли редактировать IPTC и XMP на Android с помощью CaptionMeta?", answer: "Да. Проект содержит запись IPTC и XMP, а также тесты проверки текущего процесса работы с метаданными."}]
  privacy-cleanup:
    problem: "Фотография может содержать местоположение, данные камеры и другие метаданные, которые не нужно включать в каждую передачу."
    capabilities: ["Проверять отслеживаемые категории EXIF, IPTC и XMP", "Удалять выбранные личные метаданные из обработанной копии", "Отделять исходный файл от очищенного результата"]
    supportedInputs: ["Локальные фотографии с метаданными EXIF, IPTC или XMP"]
    supportedOutputs: ["Обработанная копия с удалёнными выбранными метаданными"]
    options: ["Категории местоположения, камеры и другие отслеживаемые категории"]
    steps: ["Выберите фотографию для проверки", "Просмотрите доступные категории очистки", "Запустите очистку и используйте копию для передачи"]
    limitations: ["Очистка основана на категориях, реализованных в текущей версии приложения; проверьте результат перед публикацией."]
    faq: [{question: "Изменяет ли очистка исходную фотографию?", answer: "Документированный процесс создаёт обработанные данные для передачи. При необходимости сохраните оригинал и проверьте сохранённый результат."}]
  batch-presets:
    problem: "При повторяющихся заданиях трудно сохранять единообразие, если одни и те же поля заново вводятся для каждой фотографии."
    capabilities: ["Создавать и повторно использовать шаблоны метаданных", "Применять пакетные значения к выбранным фотографиям", "Задавать отдельные значения, когда фотографии нужна другая подпись или поле"]
    supportedInputs: ["Группа локальных фотографий и сохранённый шаблон метаданных"]
    supportedOutputs: ["Пакет обработанных копий с рассчитанными значениями метаданных"]
    options: ["Поля шаблона, пакетные значения, значения отдельных фотографий, авторство, местоположение и настройки передачи"]
    steps: ["Выберите или создайте шаблон IPTC", "Выберите поля и фотографии для обработки", "Проверьте значения отдельных фотографий и запишите итоговые значения"]
    limitations: ["Шаблон влияет только на настроенные поля процесса; пустые и отключённые поля не считаются заполненными."]
    faq: [{question: "Может ли одна фотография заменить пакетное значение?", answer: "Да. Тесты разрешения процесса подтверждают приоритет значения отдельной фотографии над настроенным пакетным значением."}]
  photo-delivery:
    problem: "Передача фотографий с места может завершиться ошибкой, если файлы, серверные настройки и повторы управляются отдельно."
    capabilities: ["Ставить обработанные файлы в очередь передачи", "Поддерживать настроенные клиенты FTP, FTPS, SFTP, HTTP, SMB и WebDAV", "Повторять некоторые временные ошибки HTTP и сохранять результаты заданий"]
    supportedInputs: ["Обработанные локальные фотографии и настроенный профиль сервера передачи"]
    supportedOutputs: ["Задание загрузки в очереди с результатом успеха или ошибки"]
    options: ["Профили серверов FTP, FTPS, SFTP, HTTP, SMB и WebDAV"]
    steps: ["Настройте профиль сервера передачи", "Выберите обработанные фотографии и добавьте их в очередь", "Следите за очередью, повторяйте подходящие ошибки и просматривайте историю"]
    limitations: ["Для передачи нужны доступный сервер и учётные данные, настроенные пользователем. Приложение не предоставляет размещённое хранилище фотографий."]
    faq: [{question: "Какие протоколы передачи поддерживаются?", answer: "Модуль загрузки содержит клиенты и модели настройки для FTP, FTPS, SFTP, HTTP, SMB и WebDAV."}]

