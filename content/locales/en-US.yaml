featureDetails:
  metadata-editor:
    problem: "Photo handoffs become inconsistent when captions, credits, rights, or keywords are edited differently for every image."
    capabilities:
      - "Read and inspect supported EXIF, IPTC, and XMP metadata."
      - "Write captions, headlines, keywords, bylines, copyright, rights, and location fields into processed photo copies."
      - "Use per-photo values to refine or override batch values."
    supportedInputs:
      - "Local photo files selected from the Android device."
    supportedOutputs:
      - "Processed photo copies with the selected metadata fields written."
    options:
      - "IPTC core and extended fields, XMP fields, EXIF handling, and location values."
    steps:
      - "Select a local photo or group of photos."
      - "Choose a preset or enter captions, headlines, keywords, bylines, and rights."
      - "Review the result and save the processed copy for sharing or delivery."
    limitations:
      - "Available fields and write behavior depend on the selected file and the metadata fields enabled in the workflow."
    faq:
      - question: "Can CaptionMeta edit IPTC and XMP metadata on Android?"
        answer: "Yes. The project contains IPTC and XMP writers and verification tests for the current photo metadata workflow."
  privacy-cleanup:
    problem: "A photo can carry location, camera, and other metadata that should not be included in every delivery."
    capabilities:
      - "Inspect tracked EXIF, IPTC, and XMP metadata categories."
      - "Scrub selected private metadata from a processed photo copy."
      - "Keep the original file separate from the cleaned output workflow."
    supportedInputs:
      - "Local photos containing EXIF, IPTC, or XMP metadata."
    supportedOutputs:
      - "A processed photo copy with selected metadata removed."
    options:
      - "Location, camera, and other tracked metadata categories exposed by the cleanup workflow."
    steps:
      - "Select the photo to inspect."
      - "Review the metadata categories available for cleanup."
      - "Run cleanup and use the processed copy for the intended delivery."
    limitations:
      - "Cleanup is based on metadata categories implemented by the current app version; review the output before publication."
    faq:
      - question: "Does cleanup change my original photo?"
        answer: "The documented workflow creates processed photo data for handling and delivery; keep your original source file as needed and review the saved result."
  batch-presets:
    problem: "Repeated photo assignments need consistent metadata without retyping the same fields for every image."
    capabilities:
      - "Create and reuse metadata templates or presets."
      - "Apply batch values to multiple selected photos."
      - "Use per-photo overrides when one image needs a different caption or field value."
    supportedInputs:
      - "A selected group of local photos and a saved metadata preset."
    supportedOutputs:
      - "A batch of processed photo copies with resolved metadata values."
    options:
      - "Preset fields, batch values, per-photo overrides, byline, location, and delivery settings."
    steps:
      - "Choose or create an IPTC preset."
      - "Select batch fields and photos to process."
      - "Review per-photo overrides and write resolved values to processed copies."
    limitations:
      - "A preset only affects fields configured for that workflow; empty or disabled fields are not implied to contain data."
    faq:
      - question: "Can one photo override a batch metadata value?"
        answer: "Yes. Workflow resolver tests cover per-photo values taking precedence over batch values for configured fields."
  photo-delivery:
    problem: "Field photo delivery can fail when files, server settings, and retry state are managed in separate places."
    capabilities:
      - "Queue processed photo files for delivery."
      - "Support configured FTP, FTPS, SFTP, HTTP, SMB, and WebDAV clients."
      - "Retry selected transient HTTP failures and keep upload task results for review."
    supportedInputs:
      - "Processed local photo files and a configured delivery server profile."
    supportedOutputs:
      - "A queued upload task and its success or failure result."
    options:
      - "FTP, FTPS, SFTP, HTTP, SMB, and WebDAV server profiles."
    steps:
      - "Configure a delivery server profile."
      - "Choose processed photos and add them to the upload queue."
      - "Monitor the queue, retry eligible failures, and review history."
    limitations:
      - "Delivery requires a reachable server and credentials configured by the user; the app does not provide hosted photo storage."
    faq:
      - question: "Which delivery protocols are supported?"
        answer: "The upload module contains clients and configuration models for FTP, FTPS, SFTP, HTTP, SMB, and WebDAV."

privacy:
  pageTitle: "Privacy - CaptionMeta"
  metaDescription: "How CaptionMeta handles photos, metadata, location permissions, and integrated services."
  heading: "Privacy"
  lastUpdatedLabel: "Last updated"
  content:
    - heading: "Data practices"
      paragraphs:
        - "CaptionMeta processes photos and metadata through the Android workflow. Processed files may be sent to a user-configured server only when the user configures delivery and starts it."
        - "The app can request camera, location, and media access for capture, GPS metadata, and photo selection workflows."
    - heading: "Integrated services"
      paragraphs:
        - "The project integrates Google Sign-In, Google Play Billing, and Firebase for account, purchase, and app operation features. Review the full privacy policy and store data-safety declaration before publication."

