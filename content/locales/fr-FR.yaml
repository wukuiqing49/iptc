home:
  pageTitle: "CaptionMeta - Outil de métadonnées photo pour Android"
  metaDescription: "Modifiez les métadonnées IPTC, EXIF et XMP sur Android, nettoyez les données privées et préparez vos photos pour la livraison."
  category: "Outil photo Android"
  tagline: "Des métadonnées photo prêtes pour le terrain."
  shortDescription: "Gardez les légendes, mots-clés, crédits, droits et flux de livraison cohérents pour les équipes photo sur Android."
  fullDescription: "CaptionMeta est un outil Android pour les métadonnées photo. Vérifiez et modifiez les champs IPTC, EXIF et XMP, réutilisez des préréglages, nettoyez les métadonnées privées et préparez des copies photo traitées pour la livraison."
  heroScreenshotAlt: "Écran réel de l’application CaptionMeta"
  heroScreenshotCaption: "Interface réelle de CaptionMeta sur un appareil connecté"
  featuresHeading: "Un flux de métadonnées, de la prise de vue à la livraison"
  featuresIntro: "Ces capacités sont fondées sur le code source Android, les tests et les écrans de l’application actuelle."
  features:
    metadata-editor: {name: "Modification IPTC, EXIF et XMP", description: "Vérifiez et modifiez les légendes, titres, mots-clés, auteurs, droits d’auteur, droits et lieux."}
    privacy-cleanup: {name: "Nettoyage des métadonnées privées", description: "Inspectez et supprimez certaines données EXIF, IPTC et XMP avant de partager une copie traitée."}
    batch-presets: {name: "Préréglages par lot", description: "Réutilisez des préréglages IPTC sur plusieurs photos tout en conservant les remplacements individuels."}
    photo-delivery: {name: "File de livraison photo", description: "Mettez les photos traitées en file, livrez-les via des serveurs configurés et vérifiez les résultats."}
  screenshotsHeading: "Voir l’application"
  screenshotsIntro: "Écrans réels capturés depuis l’application installée sur un appareil Android connecté."
  workflowHeading: "S’intègre au flux photo mobile"
