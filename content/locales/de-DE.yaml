  contactHeading: "Support kontaktieren"
  contactCopy: "Für Hilfe, Feedback zum Metadaten-Workflow oder Fragen zur Veröffentlichung eine E-Mail an den Entwickler senden."
  contactCta: "Support per E-Mail"
