  faqHeading: "Häufige Fragen"
  faq:
    - question: "Welche Android-Versionen werden unterstützt?"
      answer: "Das aktuelle Projekt setzt minSdk auf 24 und targetSdk auf 36."
    - question: "Wo ist der Google-Play-Download?"
