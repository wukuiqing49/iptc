home:
  pageTitle: "CaptionMeta - Android 사진 메타데이터 도구"
  metaDescription: "Android에서 IPTC, EXIF, XMP 사진 메타데이터를 편집하고 비공개 데이터를 정리해 사진을 전달하세요."
  category: "Android 사진 도구"
  tagline: "현장에서 바로 쓸 수 있는 사진 메타데이터."
  shortDescription: "Android에서 사진 팀의 캡션, 키워드, 크레딧, 권리 정보와 전달 작업을 일관되게 관리합니다."
  fullDescription: "CaptionMeta는 Android 사진 메타데이터 도구입니다. IPTC, EXIF, XMP 필드를 확인하고 편집하며, 메타데이터 프리셋을 재사용하고 비공개 메타데이터를 정리한 사진 사본을 전달할 수 있습니다."
  heroScreenshotAlt: "실제 CaptionMeta 앱 화면"
  heroScreenshotCaption: "연결된 기기에 표시된 CaptionMeta 화면"
  featuresHeading: "촬영부터 전달까지 이어지는 메타데이터 작업"
  featuresIntro: "현재 Android 소스 코드, 테스트와 설치된 앱 화면에서 확인된 기능입니다."
  features:
    metadata-editor: {name: "IPTC, EXIF, XMP 편집", description: "캡션, 제목, 키워드, 작성자, 저작권, 권리와 위치 메타데이터를 확인하고 편집합니다."}
    privacy-cleanup: {name: "비공개 메타데이터 정리", description: "사진 사본을 공유하기 전에 선택한 EXIF, IPTC, XMP 데이터를 확인하고 삭제합니다."}
    batch-presets: {name: "일괄 프리셋", description: "여러 사진에 IPTC 프리셋을 재사용하면서 사진별 재정의도 유지합니다."}
    photo-delivery: {name: "사진 전달 대기열", description: "처리한 사진을 대기열에 넣고 설정된 서버로 전달한 뒤 결과를 확인합니다."}
  screenshotsHeading: "앱 살펴보기"
  screenshotsIntro: "연결된 Android 기기에서 캡처한 실제 앱 화면입니다."
  workflowHeading: "모바일 사진 작업에 맞는 흐름"
  workflowIntro: "반복 입력, 개인정보 확인과 파일 전달을 하나의 Android 도구에서 처리합니다."
