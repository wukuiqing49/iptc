featureDetails:
  metadata-editor:
    problem: "تصبح عمليات تسليم الصور غير متسقة عندما تُحرّر العناوين والاعتمادات والحقوق والكلمات المفتاحية بشكل مختلف لكل صورة."
    capabilities: ["قراءة وفحص بيانات EXIF وIPTC وXMP المدعومة", "كتابة العناوين والترويسات والكلمات المفتاحية والمؤلفين وحقوق النشر والحقوق والموقع في نسخ الصور المعالجة", "استخدام قيم لكل صورة لتحسين قيم الدفعة أو استبدالها"]
    supportedInputs: ["ملفات صور محلية مختارة من جهاز Android"]
    supportedOutputs: ["نسخ صور معالجة تحتوي على حقول البيانات الوصفية المختارة"]
    options: ["حقول IPTC الأساسية والموسعة وحقول XMP ومعالجة EXIF وقيم الموقع"]
    steps: ["اختر صورة واحدة أو مجموعة صور محلية", "اختر إعداداً مسبقاً أو أدخل العناوين والترويسات والكلمات المفتاحية والمؤلف والحقوق", "راجع النتيجة واحفظ النسخة المعالجة"]
    limitations: ["تعتمد الحقول المتاحة وسلوك الكتابة على الملف المختار والحقول المفعّلة في سير العمل."]
    faq: [{question: "هل يستطيع CaptionMeta تحرير IPTC وXMP على Android؟", answer: "نعم. يتضمن المشروع كتابة IPTC وXMP واختبارات تحقق لسير عمل البيانات الوصفية الحالي."}]
  privacy-cleanup:
    problem: "قد تحتوي الصورة على الموقع والكاميرا وبيانات وصفية أخرى لا ينبغي تضمينها في كل عملية تسليم."
    capabilities: ["فحص فئات بيانات EXIF وIPTC وXMP المتتبعة", "إزالة البيانات الوصفية الخاصة المحددة من نسخة معالجة", "فصل الملف الأصلي عن سير عمل الناتج المنظف"]
    supportedInputs: ["صور محلية تحتوي على بيانات EXIF أو IPTC أو XMP"]
    supportedOutputs: ["نسخة صورة معالجة أزيلت منها البيانات المحددة"]
    options: ["فئات الموقع والكاميرا وغيرها من فئات البيانات التي يتتبعها سير التنظيف"]
    steps: ["اختر الصورة المراد فحصها", "راجع فئات البيانات المتاحة للتنظيف", "نفّذ التنظيف واستخدم النسخة المعالجة للتسليم"]
    limitations: ["يعتمد التنظيف على الفئات المنفذة في الإصدار الحالي؛ راجع الناتج قبل النشر."]
    faq: [{question: "هل يغيّر التنظيف الصورة الأصلية؟", answer: "ينشئ سير العمل الموثق بيانات صور معالجة للإدارة والتسليم. احتفظ بالأصل عند الحاجة وراجع النتيجة المحفوظة."}]
  batch-presets:
    problem: "تحتاج مهام الصور المتكررة إلى بيانات وصفية متسقة من دون إعادة إدخال الحقول نفسها لكل صورة."
    capabilities: ["إنشاء قوالب أو إعدادات بيانات وصفية مسبقة وإعادة استخدامها", "تطبيق قيم الدفعة على عدة صور مختارة", "استخدام تعديلات لكل صورة عندما تحتاج صورة إلى عنوان أو حقل مختلف"]
    supportedInputs: ["مجموعة صور محلية وإعداد بيانات وصفية محفوظ مسبقاً"]
    supportedOutputs: ["مجموعة من نسخ الصور المعالجة بقيم بيانات وصفية محسوبة"]
    options: ["حقول الإعداد المسبق وقيم الدفعة والتعديلات لكل صورة والمؤلف والموقع وإعدادات التسليم"]
    steps: ["اختر إعداد IPTC مسبقاً أو أنشئه", "اختر الحقول والصور المراد معالجتها", "راجع تعديلات كل صورة واكتب القيم النهائية"]
    limitations: ["يؤثر الإعداد المسبق في الحقول المهيأة لسير العمل فقط؛ ولا تُفترض قيم للحقول الفارغة أو المعطلة."]
    faq: [{question: "هل يمكن لصورة واحدة استبدال قيمة بيانات وصفية للدفعة؟", answer: "نعم. تغطي اختبارات محلل سير العمل أولوية قيم الصورة على قيم الدفعة للحقول المهيأة."}]
  photo-delivery:
    problem: "قد يفشل تسليم الصور الميدانية عندما تُدار الملفات وإعدادات الخادم وحالة إعادة المحاولة بشكل منفصل."
    capabilities: ["وضع ملفات الصور المعالجة في قائمة انتظار للتسليم", "دعم عملاء FTP وFTPS وSFTP وHTTP وSMB وWebDAV المهيئين", "إعادة محاولة بعض أخطاء HTTP المؤقتة والاحتفاظ بنتائج المهام"]
    supportedInputs: ["ملفات صور محلية معالجة وملف تعريف خادم تسليم مهيأ"]
    supportedOutputs: ["مهمة تحميل في قائمة الانتظار ونتيجة نجاح أو فشل"]
    options: ["ملفات تعريف خوادم FTP وFTPS وSFTP وHTTP وSMB وWebDAV"]
    steps: ["هيّئ ملف تعريف خادم التسليم", "اختر الصور المعالجة وأضفها إلى قائمة الانتظار", "راقب القائمة وأعد محاولة الأخطاء المؤهلة وراجع السجل"]
    limitations: ["يتطلب التسليم خادماً يمكن الوصول إليه وبيانات اعتماد يهيئها المستخدم. لا يوفر التطبيق تخزيناً مستضافاً للصور."]
    faq: [{question: "ما بروتوكولات تسليم الصور المدعومة؟", answer: "تتضمن وحدة التحميل عملاء ونماذج إعداد لـ FTP وFTPS وSFTP وHTTP وSMB وWebDAV."}]

privacy:
  pageTitle: "الخصوصية - CaptionMeta"
  metaDescription: "كيفية تعامل CaptionMeta مع الصور والبيانات الوصفية وأذونات الموقع والخدمات المدمجة."
  heading: "الخصوصية"
  lastUpdatedLabel: "آخر تحديث"
  content:
    - heading: "ممارسات البيانات"
      paragraphs: ["يعالج CaptionMeta الصور والبيانات الوصفية ضمن سير عمل Android. قد تُرسل الملفات المعالجة إلى خادم يهيئه المستخدم فقط عند إعداد التسليم وبدئه.", "قد يطلب التطبيق الوصول إلى الكاميرا والموقع والوسائط لدعم الالتقاط وبيانات GPS واختيار الصور."]
    - heading: "الخدمات المدمجة"
      paragraphs: ["يدمج المشروع Google Sign-In وGoogle Play Billing وFirebase لميزات الحساب والشراء وتشغيل التطبيق. راجع سياسة الخصوصية الكاملة وإقرار أمان البيانات في المتجر قبل النشر."]

support:
