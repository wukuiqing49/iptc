  faqHeading: "常见问题"
  faq:
    - question: "CaptionMeta 支持哪些系统？"
      answer: "当前项目的 minSdk 为 24，目标 SDK 为 36。"
    - question: "Google Play 下载链接在哪里？"
      answer: "正式商店地址尚未在项目官网配置中确认，页面会在确认后更新。"
  contactHeading: "联系支持"
  contactCopy: "如需帮助、反馈元数据处理问题或询问发布信息，请发送邮件给开发者。"
  contactCta: "发送邮件"
