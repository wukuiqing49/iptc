fullDescription: 'Bildunterschriften, Keywords, Credits, Rechte und Übergabe-Workflows
  für Fototeams auf Android konsistent halten.


  IPTC-, EXIF- und XMP-Bearbeitung: Bildunterschriften, Überschriften, Keywords, Urheber,
  Copyright, Rechte und Standortdaten prüfen und bearbeiten. Unterstützte EXIF-, IPTC-
  und XMP-Metadaten lesen und prüfen Bildunterschriften, Überschriften, Keywords,
  Urheber, Copyright, Rechte und Standortfelder in bearbeitete Fotokopien schreiben
  Einzelbildwerte zur Verfeinerung oder Überschreibung von Stapelwerten nutzen


  Private Metadaten bereinigen: Ausgewählte EXIF-, IPTC- und XMP-Daten vor dem Teilen
  einer bearbeiteten Fotokopie prüfen und entfernen. Erfasste EXIF-, IPTC- und XMP-Metadatenkategorien
  prüfen Ausgewählte private Metadaten aus einer bearbeiteten Fotokopie entfernen
  Originaldatei und bereinigten Ausgabe-Workflow getrennt behandeln


  Stapelvorlagen: IPTC-Vorlagen für mehrere Fotos wiederverwenden und individuelle
  Überschreibungen beibehalten. Metadatentemplates oder Vorlagen erstellen und wiederverwenden
  Stapelwerte auf mehrere ausgewählte Fotos anwenden Einzelne Fotos mit abweichender
  Bildunterschrift oder Feldwert überschreiben


  Foto-Übergabewarteschlange: Bearbeitete Fotos einreihen, über konfigurierte Server
  übertragen und Aufgabenergebnisse prüfen. Bearbeitete Fotodateien zur Übergabe einreihen
  Konfigurierte FTP-, FTPS-, SFTP-, HTTP-, SMB- und WebDAV-Clients unterstützen Bestimmte
  vorübergehende HTTP-Fehler wiederholen und Aufgabenergebnisse behalten


  Nach Bestätigung des öffentlichen Store-Eintrags führt dieser Aufruf zu Google Play.'
