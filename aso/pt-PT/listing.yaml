fullDescription: 'Mantenha legendas, palavras-chave, créditos, direitos e fluxos de
  entrega consistentes para equipas de fotografia no Android.


  Edição IPTC, EXIF e XMP: Reveja e edite legendas, títulos, palavras-chave, autores,
  direitos de autor, direitos e localização. Ler e inspecionar metadados EXIF, IPTC
  e XMP suportados Escrever legendas, títulos, palavras-chave, autores, direitos de
  autor, direitos e localização em cópias processadas Usar valores por fotografia
  para ajustar ou substituir valores de lote


  Limpeza de metadados privados: Inspecione e limpe dados EXIF, IPTC e XMP selecionados
  antes de partilhar uma cópia processada. Inspecionar categorias de metadados EXIF,
  IPTC e XMP acompanhadas Remover metadados privados selecionados de uma cópia processada
  Manter o ficheiro original separado do fluxo de saída limpo


  Predefinições em lote: Reutilize predefinições IPTC num grupo de fotografias mantendo
  substituições por fotografia. Criar e reutilizar modelos ou predefinições de metadados
  Aplicar valores de lote a várias fotografias selecionadas Usar substituições por
  fotografia quando uma imagem precisa de outra legenda ou campo


  Fila de entrega de fotografias: Coloque fotografias processadas em fila, envie-as
  através de servidores configurados e reveja os resultados. Colocar ficheiros processados
  numa fila de entrega Suportar clientes configurados de FTP, FTPS, SFTP, HTTP, SMB
  e WebDAV Repetir algumas falhas HTTP temporárias e guardar resultados das tarefas


  Quando a ficha pública da loja estiver confirmada, esta ação abrirá o Google Play.'
