fullDescription: 'حافظ على اتساق العناوين والكلمات المفتاحية والاعتمادات والحقوق وسير
  تسليم الصور على Android.


  تحرير IPTC وEXIF وXMP: راجع وحرّر العناوين والترويسات والكلمات المفتاحية والمؤلفين
  وحقوق النشر والحقوق والموقع. قراءة وفحص بيانات EXIF وIPTC وXMP المدعومة كتابة العناوين
  والترويسات والكلمات المفتاحية والمؤلفين وحقوق النشر والحقوق والموقع في نسخ الصور
  المعالجة استخدام قيم لكل صورة لتحسين قيم الدفعة أو استبدالها


  تنظيف البيانات الوصفية الخاصة: افحص ونظّف بيانات EXIF وIPTC وXMP المحددة قبل مشاركة
  نسخة معالجة من الصورة. فحص فئات بيانات EXIF وIPTC وXMP المتتبعة إزالة البيانات الوصفية
  الخاصة المحددة من نسخة معالجة فصل الملف الأصلي عن سير عمل الناتج المنظف


  إعدادات مسبقة للدفعات: أعد استخدام إعدادات IPTC المسبقة على مجموعة صور مع الحفاظ
  على التعديلات الفردية. إنشاء قوالب أو إعدادات بيانات وصفية مسبقة وإعادة استخدامها
  تطبيق قيم الدفعة على عدة صور مختارة استخدام تعديلات لكل صورة عندما تحتاج صورة إلى
  عنوان أو حقل مختلف


  قائمة انتظار تسليم الصور: ضع الصور المعالجة في قائمة انتظار، وسلّمها عبر خوادم مهيأة،
  وراجع النتائج. وضع ملفات الصور المعالجة في قائمة انتظار للتسليم دعم عملاء FTP وFTPS
  وSFTP وHTTP وSMB وWebDAV المهيئين إعادة محاولة بعض أخطاء HTTP المؤقتة والاحتفاظ
  بنتائج المهام


  بعد تأكيد صفحة المتجر العامة، سينقلك هذا الإجراء إلى Google Play.'
