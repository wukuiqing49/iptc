fullDescription: 'Поддерживайте единообразие подписей, ключевых слов, авторства, прав
  и процессов передачи фотографий на Android.


  Редактирование IPTC, EXIF и XMP: Просматривайте и редактируйте подписи, заголовки,
  ключевые слова, авторов, авторские права и местоположение. Читать и проверять поддерживаемые
  метаданные EXIF, IPTC и XMP Записывать подписи, заголовки, ключевые слова, авторство,
  права и местоположение в обработанные копии Уточнять или заменять пакетные значения
  значениями для отдельной фотографии


  Очистка личных метаданных: Проверяйте и удаляйте выбранные данные EXIF, IPTC и XMP
  перед передачей обработанной копии. Проверять отслеживаемые категории EXIF, IPTC
  и XMP Удалять выбранные личные метаданные из обработанной копии Отделять исходный
  файл от очищенного результата


  Шаблоны для пакетной обработки: Повторно используйте шаблоны IPTC для группы фотографий,
  сохраняя индивидуальные значения. Создавать и повторно использовать шаблоны метаданных
  Применять пакетные значения к выбранным фотографиям Задавать отдельные значения,
  когда фотографии нужна другая подпись или поле


  Очередь передачи фотографий: Ставьте обработанные фотографии в очередь, передавайте
  их через настроенные серверы и проверяйте результат. Ставить обработанные файлы
  в очередь передачи Поддерживать настроенные клиенты FTP, FTPS, SFTP, HTTP, SMB и
  WebDAV Повторять некоторые временные ошибки HTTP и сохранять результаты заданий


  После подтверждения публичной страницы приложения эта кнопка откроет Google Play.'
